name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-source-validation:
    name: Full source validation - Ubuntu - Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run full source validation
        run: python devtools/validation/source_self_test.py

  python310-compatibility:
    name: Python 3.10 compatibility - Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src devtools/tests

      - name: Run compatibility test profile
        run: python -m pytest -q -p no:cacheprovider devtools/tests/test_core.py devtools/tests/test_lan_mode.py devtools/tests/test_security_core.py devtools/tests/test_srtp_udp.py devtools/tests/test_v50_boundaries.py devtools/tests/test_v50_faults.py devtools/tests/test_v50_transport.py devtools/tests/test_v604_hardening.py devtools/tests/test_v610_security_upgrade.py devtools/tests/test_v611_security_hardening.py devtools/tests/test_v612_review_hardening.py devtools/tests/test_windows_firewall.py

  windows-compatibility:
    name: Windows compatibility - Python 3.13
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src devtools/tests

      - name: Import application entry points
        run: python -c "from lte_sim.web_app import SimulatorApplication; from lte_sim.security_engine import StandaloneSrtpModule; print('Windows imports OK')"

      - name: Run Windows compatibility test profile
        run: python -m pytest -q -p no:cacheprovider devtools/tests/test_core.py devtools/tests/test_lan_mode.py devtools/tests/test_security_core.py devtools/tests/test_srtp_udp.py devtools/tests/test_v50_boundaries.py devtools/tests/test_v50_faults.py devtools/tests/test_v50_transport.py devtools/tests/test_v604_hardening.py devtools/tests/test_v610_security_upgrade.py devtools/tests/test_v611_security_hardening.py devtools/tests/test_v612_review_hardening.py devtools/tests/test_windows_firewall.py
